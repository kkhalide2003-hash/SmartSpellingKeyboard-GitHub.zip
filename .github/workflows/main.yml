name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip project files
      run: |
        unzip -o SmartSpellingKeyboard-GitHub.zip -d extracted_project || true

    - name: Find and Build Project
      run: |
        PROJ_DIR=$(find . -name "build.gradle.kts" -exec dirname {} \; | head -n 1)
        echo "Building in $PROJ_DIR"
        cd "$PROJ_DIR"
        chmod +x gradlew || true
        gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: "**/app/build/outputs/apk/debug/*.apk"
        
